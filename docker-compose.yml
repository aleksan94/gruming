services:
  # Dev-сервер: зависимости должны быть уже установлены
  app:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - '${PORT:-5173}:${PORT:-5173}'
    command: npm run dev
    environment:
      - CHOKIDAR_USEPOLLING=true
      - PORT=${PORT:-5173}
    restart: unless-stopped

  # Просмотр production-сборки (нужен предварительный build): make preview
  preview:
    profiles: [tools]
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - '${PREVIEW_PORT:-4173}:4173'
    command: npm run preview

  # Установка зависимостей и сборка, запускается вручную:
  #   docker compose run --rm npm install
  #   docker compose run --rm npm run build
  # Если нужен прокси - см. docker-compose.override.example.yml
  npm:
    profiles: [tools]
    image: node:22-alpine
    working_dir: /app
    entrypoint: [npm]
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
